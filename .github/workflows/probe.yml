# Tymczasowa diagnostyka źródeł danych – do usunięcia po weryfikacji.
name: Probe data sources
on:
  push:
    branches: [claude/express-react-test-project-nsvd7k]
    paths: [.github/workflows/probe.yml, scripts/probe.mjs, server/src/**]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
