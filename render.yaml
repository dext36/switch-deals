# Render Blueprint – backend Express jako Web Service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: switch-deals-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Adres frontendu, który może wołać API (CORS). Puste = dowolny origin.
      - key: CORS_ORIGIN
        sync: false
      # Dane aplikacji Twitch – wymagane do pobierania ocen z IGDB.
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      # Klucz YouTube Data API v3 do wyszukiwania gameplayów. Bez niego strona pokaże linki do wyszukiwarki.
      - key: YOUTUBE_API_KEY
        sync: false
      # Adres połączenia z bazą Postgres (np. Neon). Bez niego dane trzymane są w pliku i znikają po restarcie.
      - key: DATABASE_URL
        sync: false
